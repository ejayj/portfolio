<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Draggable Carousel</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 1000px;
            height: 500px;
            position: relative;
            overflow: hidden;
        }
        .cards {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            gap: 20px;
            user-select: none;
            cursor: grab;
        }
        .card {
            width: 300px;
            height: 400px;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 5px 20px 0px rgba(69, 67, 96, 0.2);
            flex-shrink: 0;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card__content {
            padding: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cards" style="left:0px;">
            <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_X3kCeWYJuVS-vouoQhCfcRWKwbBX6RG1bA&usqp=CAU" alt="" /><div class="card__content"><h1>Coderpad</h1><p>Card 1</p></div></div>
            <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-jt3d-_xLuJFSQPmo6Tqepn4_wtLlgb9RHA&usqp=CAU" alt="" /><div class="card__content"><h1>Coderpad</h1><p>Card 2</p></div></div>
            <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGqsuPapsSkvE1CmgIDKLzz7wae5kXblPhan-of6_uEBgiVuikb7SXAKJuhkEL-7I47Vg&usqp=CAU" alt="" /><div class="card__content"><h1>Coderpad</h1><p>Card 3</p></div></div>
            <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8IO5pV7-yK2sN_BWo1UKij8xoRE9g2RoPHgqVD44wG0UAwXJyhPLGr4_-intJUVg-I0w&usqp=CAU" alt="" /><div class="card__content"><h1>Coderpad</h1><p>Card 4</p></div></div>
            <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTykw4RpJXpvKdG2mioMW0HfzNjXfGtzS_ojZ3adk_IBqp3xSbSVBIv0jJ2khhML_sZv5s&usqp=CAU" alt="" /><div class="card__content"><h1>Coderpad</h1><p>Card 5</p></div></div>
            <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX5G4dIuaf2GvJH8qrsqK8fJI8jcJbxo_SLQapss5k0fgcS0weQz8T2iL19MoQhBLzJQw&usqp=CAU" alt="" /><div class="card__content"><h1>Coderpad</h1><p>Card 6</p></div></div>
        </div>
    </div>
    <script>
        const slider = document.querySelector('.container');
        const cards = document.querySelector('.cards');
        let isPressed = false;
        let startX, startLeft;

        slider.addEventListener("mousedown", (e) => {
            isPressed = true;
            slider.style.cursor = "grabbing";
            startX = e.clientX;
            startLeft = parseInt(cards.style.left) || 0;
        });

        slider.addEventListener("mousemove", (e) => {
            if (!isPressed) return;
            e.preventDefault();
            let dx = e.clientX - startX;
            cards.style.left = `${startLeft + dx}px`;
            boundSlides();
        });

        window.addEventListener("mouseup", () => {
            isPressed = false;
            slider.style.cursor = "grab";
            boundSlides();
        });

        function boundSlides() {
            const containerRect = slider.getBoundingClientRect();
            const cardsRect = cards.getBoundingClientRect();
            let left = parseInt(cards.style.left) || 0;
            if (left > 0) {
                cards.style.left = "0px";
            } else if (cardsRect.right < containerRect.right) {
                cards.style.left = `-${cardsRect.width - containerRect.width}px`;
            }
        }
    </script>
</body>
</html>
